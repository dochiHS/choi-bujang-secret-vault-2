<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    h2 { font-size: 20px; margin: 30px 0 12px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    .panel { margin: 22px 0; padding: 18px 19px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    form { display: grid; gap: 10px; }
    label { display: grid; gap: 5px; font-size: 14px; color: #bfd0e5; }
    input, textarea { font: inherit; font-size: 16px; color: #ecf4ff; background: #0d1622; border: 1px solid #51667c; border-radius: 10px; padding: 10px 12px; }
    textarea { min-height: 76px; resize: vertical; }
    button { font: inherit; font-size: 15px; font-weight: 700; border: 0; border-radius: 10px; padding: 10px 16px; cursor: pointer; background: #8ad8df; color: #0d1622; }
    button.ghost { background: transparent; color: #bfd0e5; border: 1px solid #51667c; }
    button.danger { background: #d07384; color: #1b0b10; }
    button:disabled { opacity: .55; cursor: wait; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .who { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
    .msg { min-height: 1.4em; margin: 6px 0 0; font-size: 15px; }
    .msg.error { color: #ffb4c0; }
    .msg.ok { color: #9be7c4; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; margin: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    li strong { display: block; font-size: 18px; margin-bottom: 5px; overflow-wrap: anywhere; }
    li span { display: block; color: #bfd0e5; white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 10px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인을 붙입니다</div>
    <h1>점령된 자료실</h1>
    <p>이제 서버가 로그인 토큰을 직접 확인한 뒤에만 메모를 돌려줍니다. 여기에는 실제 개인정보 없이 연습용 메모만 적습니다.</p>
    <div class="notice">남은 약점: 서버는 로그인 여부만 확인하고, 그 메모의 주인인지는 아직 비교하지 않습니다. 4단계에서 막습니다.</div>

    <section id="logged-out" class="panel" hidden>
      <h2 style="margin-top:0">로그인</h2>
      <form id="login-form">
        <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
        <div class="row"><button id="login-button" type="submit">로그인</button></div>
      </form>
      <p id="login-msg" class="msg" role="status"></p>
      <p>로그인하지 않으면 메모를 볼 수 없습니다.</p>
    </section>

    <section id="logged-in" hidden>
      <div class="panel who">
        <span id="who"></span>
        <button id="logout-button" class="ghost" type="button">로그아웃</button>
      </div>
      <p id="session-msg" class="msg" role="status"></p>

      <div class="panel">
        <h2 style="margin-top:0">가상 메모 추가</h2>
        <form id="add-form">
          <label>제목 <input id="add-title" maxlength="200" required></label>
          <label>본문 <textarea id="add-body" maxlength="5000"></textarea></label>
          <div class="row"><button id="add-button" type="submit">추가</button></div>
        </form>
      </div>

      <h2>내 메모</h2>
      <ul id="notes" aria-live="polite"></ul>
    </section>

    <p id="boot-msg" class="msg">로그인 상태를 확인하는 중입니다.</p>
  </main>

  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    // 둘 다 공개용 값입니다. 서버 전용 키는 화면 코드에 넣지 않습니다.
    const SUPABASE_URL = 'https://krdfqgaagoozlgdnsbww.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_j00jun1oAzvcWlA5Sjh6JQ_SG5_nww_';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const $ = (id) => document.getElementById(id);
    const loggedOut = $('logged-out');
    const loggedIn = $('logged-in');
    const list = $('notes');
    let session = null;

    function say(el, text, kind = '') {
      el.textContent = text;
      el.className = `msg ${kind}`.trim();
    }

    // 로그인 실패 이유를 사람이 읽을 말로 바꿉니다(원래 오류 코드도 같이 보여 줍니다).
    function loginReason(error) {
      const code = error?.code ?? '';
      const reasons = {
        invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
        email_not_confirmed: '이메일 인증이 아직 끝나지 않은 계정입니다.',
        user_banned: '사용이 막힌 계정입니다.',
        over_request_rate_limit: '시도가 너무 많습니다. 잠시 뒤 다시 해 주세요.',
        over_email_send_rate_limit: '시도가 너무 많습니다. 잠시 뒤 다시 해 주세요.',
        validation_failed: '이메일과 비밀번호 형식을 확인해 주세요.',
      };
      if (reasons[code]) return `로그인 실패: ${reasons[code]} (${code})`;
      if (error?.name === 'AuthRetryableFetchError' || error?.status === 0) {
        return '로그인 실패: 로그인 서버에 연결하지 못했습니다. 네트워크를 확인해 주세요.';
      }
      return `로그인 실패: ${error?.message || '알 수 없는 오류'}${code ? ` (${code})` : ''}`;
    }

    // 서버 API 호출. 토큰은 Supabase SDK가 준 세션의 access_token만 씁니다.
    async function api(path, { method = 'GET', body } = {}) {
      const { data } = await supabase.auth.getSession();
      const token = data.session?.access_token;
      if (!token) throw new Error('로그인이 필요합니다.');
      const response = await fetch(path, {
        method,
        cache: 'no-store',
        headers: {
          Authorization: `Bearer ${token}`,
          ...(body ? { 'Content-Type': 'application/json' } : {}),
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      if (response.status === 204) return null;
      let payload = null;
      try { payload = await response.json(); } catch { payload = null; }
      if (!response.ok) {
        const reason = payload?.error ?? `HTTP ${response.status}`;
        const error = new Error(response.status === 401 ? `${reason} 다시 로그인해 주세요.` : reason);
        error.status = response.status;
        throw error;
      }
      return payload;
    }

    function noteItem(note) {
      const item = document.createElement('li');
      const view = document.createElement('div');
      const title = document.createElement('strong');
      const body = document.createElement('span');
      title.textContent = note.title;
      body.textContent = note.body;
      const actions = document.createElement('div');
      actions.className = 'row';
      const edit = document.createElement('button');
      edit.type = 'button'; edit.className = 'ghost'; edit.textContent = '수정';
      const del = document.createElement('button');
      del.type = 'button'; del.className = 'ghost'; del.textContent = '삭제';
      actions.append(edit, del);
      view.append(title, body, actions);

      const form = document.createElement('form');
      form.hidden = true;
      const titleInput = document.createElement('input');
      titleInput.maxLength = 200; titleInput.required = true; titleInput.value = note.title;
      titleInput.setAttribute('aria-label', '제목');
      const bodyInput = document.createElement('textarea');
      bodyInput.maxLength = 5000; bodyInput.value = note.body;
      bodyInput.setAttribute('aria-label', '본문');
      const formActions = document.createElement('div');
      formActions.className = 'row';
      const save = document.createElement('button');
      save.type = 'submit'; save.textContent = '저장';
      const cancel = document.createElement('button');
      cancel.type = 'button'; cancel.className = 'ghost'; cancel.textContent = '취소';
      formActions.append(save, cancel);
      form.append(titleInput, bodyInput, formActions);

      edit.addEventListener('click', () => { view.hidden = true; form.hidden = false; titleInput.focus(); });
      cancel.addEventListener('click', () => { form.hidden = true; view.hidden = false; });
      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        save.disabled = true;
        try {
          await api(`/api/notes/${encodeURIComponent(note.id)}`, {
            method: 'PUT', body: { title: titleInput.value, body: bodyInput.value },
          });
          say($('session-msg'), '메모를 수정했습니다.', 'ok');
          await loadNotes();
        } catch (error) {
          say($('session-msg'), `수정 실패: ${error.message}`, 'error');
          save.disabled = false;
        }
      });

      // 브라우저 확인 창 대신 버튼을 한 번 더 누르게 합니다.
      let armed = false;
      del.addEventListener('click', async () => {
        if (!armed) {
          armed = true; del.textContent = '정말 삭제'; del.className = 'danger';
          setTimeout(() => { armed = false; del.textContent = '삭제'; del.className = 'ghost'; }, 4000);
          return;
        }
        del.disabled = true;
        try {
          await api(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
          say($('session-msg'), '메모를 삭제했습니다.', 'ok');
          await loadNotes();
        } catch (error) {
          say($('session-msg'), `삭제 실패: ${error.message}`, 'error');
          del.disabled = false;
        }
      });

      item.append(view, form);
      return item;
    }

    async function loadNotes() {
      try {
        const notes = await api('/api/notes');
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) {
          const empty = document.createElement('li');
          empty.textContent = '아직 메모가 없습니다. 위에서 가상 메모를 추가해 보세요.';
          list.replaceChildren(empty);
          return;
        }
        list.replaceChildren(...notes.map(noteItem));
      } catch (error) {
        const item = document.createElement('li');
        item.textContent = `메모를 불러오지 못했습니다: ${error.message}`;
        list.replaceChildren(item);
      }
    }

    function render(nextSession) {
      session = nextSession;
      $('boot-msg').hidden = true;
      loggedOut.hidden = Boolean(session);
      loggedIn.hidden = !session;
      if (session) {
        $('who').textContent = `${session.user.email ?? '로그인한 사용자'} 로 로그인됨`;
        loadNotes();
      } else {
        list.replaceChildren();
        say($('session-msg'), '');
      }
    }

    $('login-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = $('login-button');
      button.disabled = true;
      say($('login-msg'), '로그인하는 중입니다.');
      const { error } = await supabase.auth.signInWithPassword({
        email: $('email').value.trim(),
        password: $('password').value,
      });
      button.disabled = false;
      if (error) {
        say($('login-msg'), loginReason(error), 'error');
        return;
      }
      $('password').value = '';
      say($('login-msg'), '');
    });

    $('logout-button').addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      if (error) say($('session-msg'), `로그아웃 실패: ${error.message}`, 'error');
      else say($('login-msg'), '로그아웃했습니다.', 'ok');
    });

    $('add-form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = $('add-button');
      button.disabled = true;
      try {
        await api('/api/notes', {
          method: 'POST', body: { title: $('add-title').value, body: $('add-body').value },
        });
        $('add-form').reset();
        say($('session-msg'), '메모를 추가했습니다.', 'ok');
        await loadNotes();
      } catch (error) {
        say($('session-msg'), `추가 실패: ${error.message}`, 'error');
      } finally {
        button.disabled = false;
      }
    });

    supabase.auth.onAuthStateChange((event, nextSession) => {
      if (event === 'TOKEN_REFRESHED') { session = nextSession; return; }
      setTimeout(() => render(nextSession), 0);
    });
  </script>
</body>
</html>
